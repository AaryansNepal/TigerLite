[project]
name = "tigerlite-mcp"
version = "0.1.0"
description = "MCP tool server for querying TigerLite's Iceberg data lake"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "duckdb>=0.10.0",
    "pyiceberg[s3fs,pyarrow]>=0.6.0",
    "pyarrow>=15.0.0",
    "pytz",
]

[tool.setuptools]
py-modules = ["server", "tools"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"
