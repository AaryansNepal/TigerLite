services:
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 admin password &&
      mc mb --ignore-existing myminio/warehouse &&
      mc mb --ignore-existing myminio/snapshots &&
      echo 'Buckets created successfully'
      "

  rest-catalog:
    image: tabulario/iceberg-rest:1.5.0
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    depends_on:
      minio-setup:
        condition: service_completed_successfully

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password
      ICEBERG_REST_URI: http://rest-catalog:8181
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      rest-catalog:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  go-ingestion:
    build: ./go-ingestion
    ports:
      - "8080:8080"
    environment:
      BACKEND_URL: http://backend:8000
      PORT: "8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  simulator:
    build: ./simulator
    environment:
      BACKEND_URL: http://backend:8000
      GO_INGESTION_URL: http://go-ingestion:8080
    depends_on:
      backend:
        condition: service_healthy
      go-ingestion:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

  mcp-server:
    build: ./mcp-server
    environment:
      ICEBERG_REST_URI: http://rest-catalog:8181
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    depends_on:
      rest-catalog:
        condition: service_started
    profiles:
      - mcp

volumes:
  minio-data:
