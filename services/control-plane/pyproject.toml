[project]
name = "tigerlite-control"
version = "2.0.0.dev0"
description = "TigerLite v2 control plane: agents CRUD, queue, watchers, internal Iceberg writer."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "asyncpg>=0.30.0",
  "httpx>=0.28.0",
  "duckdb>=1.1.0",
  "pyiceberg[s3fs,duckdb]>=0.7.1",
  "pyjwt[crypto]>=2.9.0",
  "bcrypt>=4.2.0",
  "python-dotenv>=1.0.1",
  "structlog>=24.4.0",
  "apscheduler>=3.10.4",
  "google-genai>=0.3.0",
  "tenacity>=9.0.0",
  "cryptography>=43.0.0",
  "boto3>=1.35.0",
  "botocore>=1.35.0",
  "jq>=1.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tigerlite_control"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
