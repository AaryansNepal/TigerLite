[project]
name = "tigerlite-runtime"
version = "2.0.0.dev0"
description = "TigerLite v2 agent runtime: snapshot loop worker."
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.30.0",
  "httpx>=0.28.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "structlog>=24.4.0",
  "google-genai>=0.3.0",
  "boto3>=1.35.0",
  "python-dotenv>=1.0.1",
  "tenacity>=9.0.0",
  "anthropic>=0.39.0",
  "cryptography>=43.0.0",
  "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tigerlite_runtime"]

[tool.ruff]
line-length = 100
target-version = "py311"
