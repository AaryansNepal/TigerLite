# nginx reverse proxy — serves the SPA and proxies API/SSE to the Python backend.
# Buffering and caching disabled on /api/ so SSE streams through without delay.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all client-side routes resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + SSE proxy — no buffering so server-sent events stream in real time
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;  # keep SSE connections alive for 24h
    }

    location /health {
        proxy_pass http://backend:8000;
    }

    location /ingest {
        proxy_pass http://backend:8000;
    }
}
